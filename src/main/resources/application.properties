spring.config.import=optional:file:.env[.properties]

# Configuración compartida
spring.application.name=harmonyGymBack
spring.profiles.active=dev

# Puerto
server.port=${PORT:8081}

# Database base
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.from=${MAIL_USERNAME}
app.email.subject.credenciales=Tus credenciales de acceso - HarmonyGym

# PayPal
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}

# Seguridad y CORS
jwt.secret=${JWT_SECRET:HarmonyGymSecretKey2026SuperSecureAndLongEnoughForHmacSha256Signature!}
jwt.expiracion-horas=${JWT_EXPIRACION_HORAS:8}
app.cors.front-url=${FRONT_URL:http://localhost:4200}
