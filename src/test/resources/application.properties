spring.application.name=harmonyGymBackTest

# Database H2 in PostgreSQL mode for unit/integration tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Mail mock config for tests
spring.mail.host=localhost
spring.mail.port=25
app.email.from=test@harmonygym.com
app.email.subject.credenciales=Tus credenciales de acceso - HarmonyGym

# PayPal mock properties
paypal.client-id=test-client-id
paypal.client-secret=test-client-secret
paypal.base-url=https://api-m.sandbox.paypal.com

# Errores
server.error.include-message=always

# Logging
logging.level.com.example.harmonyGymBack=INFO
